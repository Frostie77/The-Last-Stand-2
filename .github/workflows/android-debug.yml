name: Android development builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise Windows PowerShell input and performance capture
        shell: pwsh
        run: python tests/test_capture_transport.py --powershell powershell.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify controller profile
        run: python3 tests/test_control_profile.py
      - name: Validate controller capture helper
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($file in @('capture-controller-input.ps1','test-reload.ps1','build-public-release.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile("$pwd/$file", [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Verify pointer, keyboard ownership and lifecycle
        run: node tests/test_input.cjs
      - name: Verify temporary performance and audio probes
        run: node tests/test_performance_probe.cjs
      - name: Verify combat sound preparation and fallback
        run: node tests/test_combat_audio.cjs
      - name: Verify reload state capture and cleanup
        run: node tests/test_capture_probe.cjs
      - name: Verify stable updater
        run: python3 tests/test_updates.py
      - name: Install Android 35
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Retrieve pinned Ruffle
        run: |
          curl --fail --location --silent --show-error https://registry.npmjs.org/@ruffle-rs/ruffle/-/ruffle-0.7.1.tgz -o /tmp/tls2-ruffle.tgz
          echo 'dc9e7407549a91accc41a14932b0b9d9a9d51a3742ce6f020888c8a76682b157  /tmp/tls2-ruffle.tgz' | sha256sum -c -
          mkdir -p /tmp/tls2-ruffle app/src/main/assets/www/ruffle
          tar -xzf /tmp/tls2-ruffle.tgz -C /tmp/tls2-ruffle
          cp -R /tmp/tls2-ruffle/package/. app/src/main/assets/www/ruffle/
      - name: Build and test Android host and shared frontend
        run: gradle --no-daemon :frostfrontend:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Verify particles, combat pointer and controller recovery in pinned Ruffle
        timeout-minutes: 5
        run: |
          npm install --prefix /tmp/tls2-engine --no-save --package-lock=false playwright@1.62.1
          export NODE_PATH=/tmp/tls2-engine/node_modules
          export TLS2_CHROMIUM_PATH="$(command -v google-chrome)"
          test -x "$TLS2_CHROMIUM_PATH"
          node tests/test_particles.cjs
          node tests/test_loops.cjs
          node tests/test_ruffle_recovery.cjs
      - name: Verify identity and game-free APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json, os, subprocess
          aapt = str(Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0/aapt')
          hashes = json.loads(Path('ruffle-0.7.1.sha256.json').read_text())
          for variant in ('debug', 'release'):
              apk = next(Path('app/build/outputs/apk', variant).glob('*.apk'))
              badging = subprocess.check_output([aapt,'dump','badging',str(apk)],text=True)
              assert "name='io.github.frostie77.laststand2'" in badging
              assert "versionCode='2'" in badging
              version = '0.1.0-dev' if variant == 'debug' else '0.1.0'
              assert f"versionName='{version}'" in badging
              assert ('application-debuggable' in badging) == (variant == 'debug')
              assert "application-label:'The Last Stand 2'" in badging
              assert "sdkVersion:'26'" in badging
              with ZipFile(apk) as z:
                  assert not any(n.lower().endswith('.swf') for n in z.namelist())
                  for name in ('index.html', 'combat-audio.js'):
                      assert z.read('assets/www/' + name) == Path('app/src/main/assets/www', name).read_bytes()
                  for name, digest in hashes.items():
                      assert hashlib.sha256(z.read('assets/www/ruffle/' + name)).hexdigest() == digest, name
          print('PASS: Debug/Release identity, HTML, pinned runtime and no bundled SWF.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: The-Last-Stand-2-Android-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-results
          path: '**/build/reports/tests/'

  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Install Android 35
        shell: powershell
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK setup failed.' }
      - name: Sign and verify a release with a disposable key
        shell: powershell
        run: |
          $liveFeed = Join-Path $env:GITHUB_WORKSPACE 'updates\android-stable.json'
          $liveHash = (Get-FileHash -LiteralPath $liveFeed).Hash
          # Keep testing a first release after the production feed is populated.
          $fixture = Join-Path $env:RUNNER_TEMP 'tls2-release-fixture'
          & git clone --no-hardlinks $env:GITHUB_WORKSPACE $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Release fixture checkout failed.' }
          Set-Location $fixture
          $feedPath = Join-Path $fixture 'updates\android-stable.json'
          $initial = Get-Content -Raw -LiteralPath $feedPath | ConvertFrom-Json
          $initial.latest = $null
          [IO.File]::WriteAllText($feedPath, ($initial | ConvertTo-Json))
          & git add updates/android-stable.json
          & git -c user.name='Release Test' -c user.email='release-test@example.invalid' commit --allow-empty -m 'Set up first release fixture'
          if ($LASTEXITCODE -ne 0 -or (& git rev-parse HEAD^).Trim() -cne $env:GITHUB_SHA) {
            throw 'Release fixture commit is invalid.'
          }
          $fixtureHash = (Get-FileHash -LiteralPath $feedPath).Hash
          $env:TLS2_CI_SIGNING_PASSWORD = [Guid]::NewGuid().ToString('N')
          $key = Join-Path $env:RUNNER_TEMP 'tls2-disposable-release.keystore'
          try {
            & .\build-public-release.ps1 -KeystorePath $key -SigningPasswordEnvironment TLS2_CI_SIGNING_PASSWORD
            $folder = Get-ChildItem 'release' -Directory | Select-Object -First 1
            $staged = (Get-Content -Raw -LiteralPath (Join-Path $folder.FullName 'android-stable.json') | ConvertFrom-Json).latest
            $apk = Join-Path $folder.FullName $staged.apk_asset
            $hash = (Get-FileHash -LiteralPath $apk).Hash.ToLowerInvariant()
            $pin = $key + '.certificate.sha256'
            $certificate = (Get-Content -Raw -LiteralPath $pin).Trim()
            if ($staged.source_commit -cne (& git rev-parse HEAD).Trim() -or
                $staged.apk_sha256 -cne $hash -or $staged.apk_size -ne (Get-Item -LiteralPath $apk).Length -or
                $staged.certificate_sha256 -cne $certificate) { throw 'Staged release metadata mismatch.' }
            Set-Content -LiteralPath $pin -Value ('b' * 64)
            $rejected = $false
            try {
              & .\build-public-release.ps1 -KeystorePath $key -SigningPasswordEnvironment TLS2_CI_SIGNING_PASSWORD
            } catch {
              if ($_.Exception.Message -notmatch 'established local release identity') { throw }
              $rejected = $true
            }
            if (-not $rejected -or (Get-FileHash -LiteralPath $apk).Hash.ToLowerInvariant() -cne $hash) {
              throw 'Mismatched key was accepted or changed the staged APK.'
            }
            if ((Get-FileHash -LiteralPath $liveFeed).Hash -cne $liveHash -or
                (Get-FileHash -LiteralPath $feedPath).Hash -cne $fixtureHash) { throw 'The live feed was changed.' }
            Write-Host 'PASS: signed APK, matching staged feed and mismatched-key rejection.'
          } finally {
            Remove-Item Env:\TLS2_CI_SIGNING_PASSWORD
          }
